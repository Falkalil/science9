<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>العلوم – الصف الثالث المتوسط – كتاب تفاعلي</title>

<link href="fonts/tajawal.css" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link href="play.css" rel="stylesheet">
<meta name="theme-color" content="#071c26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="علوم ٣ متوسط">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--ink:#2b2117;--accent:#0d8f8c;--accent2:#e8a33a;--paper:#fffdf7;--ui:rgba(30,22,14,.78);--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);background:#2a1a0e;touch-action:none;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
/* ── الطاولة الخشبية والمصباح ── */
#desk{position:fixed;inset:0;overflow:hidden;
  background:
   radial-gradient(ellipse 70% 60% at 52% 38%,rgba(255,214,140,.38),rgba(255,190,100,.12) 45%,rgba(0,0,0,0) 70%),
   radial-gradient(ellipse 120% 90% at 50% 40%,rgba(0,0,0,0) 40%,rgba(0,0,0,.65) 100%),
   repeating-linear-gradient(92deg,rgba(0,0,0,.0) 0 22px,rgba(0,0,0,.07) 23px 24px,rgba(0,0,0,0) 25px 61px,rgba(255,255,255,.04) 62px 63px),
   repeating-linear-gradient(88deg,rgba(80,40,10,.0) 0 140px,rgba(60,28,8,.18) 141px 150px,rgba(80,40,10,0) 151px 260px),
   linear-gradient(180deg,#8a5a33,#6e4424 50%,#5a361b);}
#desk::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply;
  background:repeating-radial-gradient(ellipse 900px 40px at 30% 120%,rgba(70,35,10,0) 0 14px,rgba(70,35,10,.25) 15px 16px)}
#lamp{position:absolute;top:calc(-10px + var(--safeT));left:-1vw;width:min(26vw,230px);pointer-events:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));z-index:3}
#lampLight{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 6%,rgba(255,236,190,.35),rgba(255,220,150,0) 38%);mix-blend-mode:screen;z-index:1}
/* ── المسرح والكتاب ── */
#stage{position:absolute;left:0;right:0;top:calc(8px + var(--safeT));bottom:calc(70px + var(--safeB));display:flex;align-items:center;justify-content:center;perspective:1700px;perspective-origin:50% 0%;z-index:2}
#bookWrap{position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
#book{position:relative;transform-style:preserve-3d}
#bookShadow{position:absolute;left:3%;right:3%;bottom:-3%;height:12%;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,0) 70%);filter:blur(8px);transform:translateZ(-2px)}
.tilted #bookWrap{transform:rotateX(24deg) translateY(-2%)}
@media (max-width:700px){.tilted #bookWrap{transform:rotateX(14deg)}}
.flat #bookWrap{transform:none}
.slot{position:absolute;top:0;height:100%;background:var(--paper);overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.1)}
.slot.R{right:0;width:50%}.slot.L{left:0;width:50%}.slot.S{left:0;width:100%}
.slot::after,.face::after{content:"";position:absolute;inset:0;pointer-events:none}
.slot.R::after,.face.R::after{background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,.06) 3%,rgba(0,0,0,0) 8%)}
.slot.L::after,.face.L::after{background:linear-gradient(270deg,rgba(0,0,0,.22),rgba(0,0,0,.06) 3%,rgba(0,0,0,0) 8%)}
.slot.S::after{background:linear-gradient(270deg,rgba(0,0,0,.18),rgba(0,0,0,0) 4%)}
#pagesEdge{position:absolute;inset:-6px -5px -9px -5px;border-radius:4px;background:repeating-linear-gradient(0deg,#efe6d2 0 1px,#d9ceb6 1px 2px);box-shadow:0 18px 40px rgba(0,0,0,.45);transform:translateZ(-1px)}
.page{position:absolute;inset:0}
.page img.pg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;-webkit-user-drag:none}
.hot{position:absolute;overflow:hidden;cursor:pointer;border-radius:6px}
.hot canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hot .badge{position:absolute;top:4%;left:3%;font-weight:800;font-size:clamp(8px,1.25vmin,13px);padding:.25em .7em;border-radius:99px;background:linear-gradient(135deg,#0da9a6,#15445a);color:#fff;box-shadow:0 2px 8px rgba(13,169,166,.55);animation:pulse 2.2s ease-in-out infinite;white-space:nowrap;z-index:2;pointer-events:none}
.hot .tapHint{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);font-size:clamp(7px,1.1vmin,12px);background:rgba(0,0,0,.55);color:#fff;padding:.2em .7em;border-radius:99px;opacity:.85;white-space:nowrap;pointer-events:none}
.hot.lifted canvas{opacity:.15}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.patch{position:absolute;background-repeat:no-repeat;pointer-events:none;z-index:3}
/* ورقة القلب */
#flipper{position:absolute;top:0;height:100%;transform-style:preserve-3d;display:none;z-index:20}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face .shade{position:absolute;inset:0;pointer-events:none;z-index:30}
/* ── شريط الأدوات ── */
#bar{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + var(--safeB));display:flex;align-items:center;justify-content:center;gap:6px;z-index:30;background:linear-gradient(0deg,rgba(7,28,38,.92),rgba(7,28,38,.62));backdrop-filter:blur(6px)}
.tb{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:12px;height:44px;min-width:44px;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
.tb:active{transform:scale(.96)}.tb.on{background:var(--accent)}
.tb svg{width:22px;height:22px;flex:none}
#pnum{color:#fff;font-weight:800;min-width:92px;text-align:center;font-size:15px;background:rgba(255,255,255,.08);border-radius:12px;height:44px;display:flex;align-items:center;justify-content:center;padding:0 10px;border:0}
.lbl{display:none}@media(min-width:760px){.lbl{display:inline}}
/* ── اللوحات الجانبية ── */
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(400px,92vw);background:#f6f9fa;z-index:60;transform:translateX(105%);transition:transform .35s cubic-bezier(.3,.7,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.4);padding-top:var(--safeT)}
.drawer.open{transform:none}
.drawer h2{margin:0;padding:16px 18px;font-size:19px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eadfca;background:#eaf2f4}
.drawer .x{border:0;background:#0001;width:38px;height:38px;border-radius:10px;font-size:20px}
.drawer .body{overflow:auto;padding:8px 10px calc(20px + var(--safeB));-webkit-overflow-scrolling:touch;touch-action:pan-y}
.unit{font-weight:800;color:#fff;background:var(--accent);padding:9px 12px;border-radius:10px;margin:12px 4px 6px}
.ti{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;font-size:15px;cursor:pointer}
.ti:hover,.ti:active{background:#f3e7cc}.ti.ch{font-weight:800;color:#15445a}
.ti b{color:#a06a1a;font-weight:800;flex:none}
.mi{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;cursor:pointer;border:1px solid #eadfca;margin:8px 4px;background:#fff}
.mi:active{background:#f3e7cc}
.mi .th{width:64px;height:64px;border-radius:10px;flex:none;background-repeat:no-repeat;border:1px solid #e5d7bb}
.mi .tt{font-weight:800}.mi .ss{font-size:13px;color:#7a6a55}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none}
#goto{display:flex;gap:8px;padding:10px 6px}#goto input{flex:1;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid #d9c9a8;direction:ltr;text-align:center}
#goto button{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:0 16px;font-weight:800}
/* ── التكبير ── */
#zoom{position:fixed;inset:0;z-index:70;background:#1d140c;display:none;flex-direction:column}
#zoom .zt{display:flex;gap:8px;align-items:center;padding:calc(8px + var(--safeT)) 10px 8px;background:#2a1d11;color:#fff;justify-content:space-between}
#zoom .zs{flex:1;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
#zoom .zin{display:flex;flex-direction:row-reverse;gap:8px;margin:0 auto;padding:10px;transform-origin:0 0}
#zoom .zin img{display:block;background:#fff;box-shadow:0 4px 20px #000}
/* ── المجسّم المرفوع ── */
#lift{position:fixed;inset:0;z-index:80;display:none}
#lift .back{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(40,28,16,.55),rgba(10,6,3,.88));backdrop-filter:blur(3px);opacity:0;transition:opacity .5s}
#lift.show .back{opacity:1}
#v3{position:absolute;inset:0;transform-origin:0 0;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#v3 canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.plabel{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.94);color:#123;border:2px solid #0d8f8c;font-weight:800;font-size:13px;padding:3px 9px;border-radius:9px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.plabel::after{content:"";position:absolute;left:50%;bottom:-8px;width:2px;height:7px;background:#0d8f8c;transform:translateX(-50%)}
.plabel.sel{background:#ffe27a;border-color:#d08a00}
#ui3{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s .25s}
#lift.show #ui3{opacity:1}
#ui3>*{pointer-events:auto}
#top3{position:absolute;top:calc(10px + var(--safeT));right:10px;left:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;pointer-events:none}
#top3>*{pointer-events:auto}
#ttl{background:rgba(255,255,255,.95);border-radius:14px;padding:8px 14px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:60vw}
#ttl small{display:block;font-weight:600;color:#7a6a55;font-size:12px}
#btns3{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.b3{border:0;border-radius:12px;background:rgba(255,255,255,.95);color:#1b2a22;font-weight:800;font-size:14px;height:40px;padding:0 12px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;gap:6px}
.b3.on{background:var(--accent);color:#fff}.b3.ret{background:#0da9a6;color:#fff}
#info{position:absolute;right:12px;top:calc(76px + var(--safeT));width:min(360px,calc(100vw - 24px));background:rgba(255,255,255,.97);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none;border-top:5px solid var(--accent)}
#info h3{margin:0 0 6px;font-size:18px}#info p{margin:0;line-height:1.8;font-size:15px;white-space:pre-line}
#info .x{position:absolute;left:8px;top:8px;border:0;background:#0001;border-radius:8px;width:30px;height:30px}
#ctl{position:absolute;left:12px;bottom:calc(12px + var(--safeB));width:min(360px,calc(100vw - 24px));max-height:calc(100% - 130px);overflow:auto;background:rgba(255,253,246,.97);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:10px 12px;touch-action:pan-y}
#ctl .hd{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:#15445a;cursor:pointer}
#ctl.min .bd{display:none}
.cr{margin:10px 0}.cr label{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:4px}.cr label span{color:#a06a1a}
.cr input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.cb{width:100%;border:0;border-radius:12px;background:#e9f4ee;color:#15445a;font-weight:800;height:42px;font-size:15px}
.cb.on{background:var(--accent);color:#fff}
.seg{display:flex;gap:4px;background:#efe5cf;border-radius:12px;padding:3px}.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;font-weight:700;font-size:13px}.seg button.on{background:#fff;color:#15445a;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.steps .st{font-weight:800;margin:4px 0}.steps .sd{font-size:14px;line-height:1.7;color:#4a3d2c;min-height:3.4em}
.steps .nav{display:flex;gap:6px;margin-top:6px}.steps .nav button{flex:1;border:0;height:40px;border-radius:10px;background:#e9f4ee;color:#15445a;font-weight:800}
.steps .dots{display:flex;gap:4px;justify-content:center;margin-top:6px}.steps .dots i{width:8px;height:8px;border-radius:9px;background:#d8ccb2}.steps .dots i.on{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:13px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:12px;height:12px;border-radius:9px;display:inline-block}
#toast{position:absolute;left:50%;top:calc(70px + var(--safeT));transform:translateX(-50%);max-width:min(560px,86vw);background:rgba(20,40,30,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;line-height:1.7;display:none;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#quiz{position:absolute;right:12px;top:calc(76px + var(--safeT));width:min(380px,calc(100vw - 24px));background:#fff;border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none;border-top:5px solid #0da9a6}
#quiz .qh{display:flex;justify-content:space-between;font-weight:800;color:#a85a00;font-size:14px}
#quiz .qq{font-size:17px;font-weight:800;margin:8px 0;line-height:1.6}
#quiz .qf{font-weight:800;min-height:1.5em}#quiz .ok{color:#1f8a4c}#quiz .no{color:#c62828}
#quiz .qb{display:flex;gap:6px;margin-top:8px}#quiz .qb button{flex:1;border:0;height:40px;border-radius:10px;font-weight:800;background:#fff0dc;color:#a85a00}
#cmp{position:absolute;left:12px;top:calc(76px + var(--safeT));width:min(330px,46vw);background:#fff;border-radius:14px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none}
#cmp .ci{width:100%;background-repeat:no-repeat;border-radius:8px;border:1px solid #ddd}
#cmp .cc{font-size:12px;color:#7a6a55;font-weight:700;margin:2px 4px 6px;display:flex;justify-content:space-between}
@media (max-width:700px){
  #ctl{left:8px;right:8px;width:auto;max-height:42%;bottom:calc(8px + var(--safeB))}
  #info,#quiz{right:8px;left:8px;width:auto;top:auto;bottom:calc(50% + 8px)}
  #cmp{top:calc(116px + var(--safeT));width:44vw}
  #ttl{max-width:100%;font-size:14px}
  .b3{height:36px;font-size:13px;padding:0 9px}
  #toast{top:calc(118px + var(--safeT))}
}

/* ── قلم التظليل ── */
canvas.hlc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;mix-blend-mode:multiply;opacity:.5}
body.hl canvas.hlc{pointer-events:auto;cursor:crosshair;touch-action:none}
body.hl .hot .badge,body.hl .hot .tapHint{display:none}
#hlBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + var(--safeB));z-index:40;display:none;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:rgba(255,253,246,.97);border-radius:16px;padding:8px 10px;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:calc(100vw - 16px)}
body.hl #hlBar{display:flex}
#hlBar .sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cbb;cursor:pointer}
#hlBar .sw.on{box-shadow:0 0 0 3px #15445a}
#hlBar .hb{border:0;border-radius:10px;height:36px;padding:0 10px;font-weight:800;background:#efe6d2;color:#3a2a1a;font-size:13px}
#hlBar .hb.on{background:#0d8f8c;color:#fff}
#hlBar .sep{width:1px;height:28px;background:#ddd}
@media (max-width:700px){#hlBar{left:8px;right:8px;transform:none;max-width:none;gap:6px}#hlBar .sw{width:30px;height:30px}#hlBar .hb{height:34px;padding:0 8px}}
body.hl #btnHL{background:#ffcf3a;color:#3a2a1a}

#pz{position:relative;transform-origin:0 0;transform-style:preserve-3d;will-change:transform}
#pz.anim{transition:transform .3s ease}
.mob{display:none}
@media (max-width:700px){.dsk{display:none!important}.mob{display:flex}}
#toolsPop{position:fixed;bottom:calc(70px + var(--safeB));left:10px;z-index:45;background:#f6f9fa;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);padding:8px;display:none;flex-direction:column;gap:6px;min-width:190px}
#toolsPop.open{display:flex}
#toolsPop button{border:0;border-radius:12px;background:#e6eef1;height:44px;font-family:inherit;font-weight:800;font-size:15px;text-align:right;padding:0 14px}
#zReset{position:fixed;top:calc(10px + var(--safeT));right:12px;z-index:36;border:0;border-radius:999px;background:#15445a;color:#fff;font-family:inherit;font-weight:800;padding:9px 14px;box-shadow:0 6px 20px rgba(0,0,0,.4);display:none}
body.zoomed #zReset{display:block}
body.zoomed #lessonChip{display:none!important}
/* ── الكتابة على الكتاب ── */
.note{position:absolute;z-index:7;min-width:1.5em;padding:.1em .3em;font-family:'Tajawal',sans-serif;font-weight:700;line-height:1.35;white-space:pre-wrap;word-break:break-word;max-width:70%;border-radius:4px;outline:none;direction:rtl;text-align:right;pointer-events:none}
.note.bg{background:rgba(255,236,120,.85);box-shadow:0 1px 3px rgba(0,0,0,.2)}
body.nt .note{pointer-events:auto;outline:1.5px dashed rgba(26,79,208,.5);cursor:text}
body.nt .note:focus{outline:2px solid #1a4fd0;background-color:rgba(255,255,255,.75)}
body.nt .note.bg:focus{background:rgba(255,236,120,.95)}
.note .nx,.note .ng{display:none;position:absolute;top:-.9em;width:1.6em;height:1.6em;border-radius:50%;border:0;color:#fff;font-size:12px;line-height:1.6em;text-align:center;padding:0;cursor:pointer;user-select:none;-webkit-user-select:none}
.note .nx{left:-.9em;background:#d32f2f}.note .ng{right:-.9em;background:#15445a;cursor:grab;touch-action:none}
body.nt .note .nx,body.nt .note .ng{display:block}
body.nt .slot .page{cursor:text}
body.nt .hot .badge,body.nt .hot .tapHint{display:none}
#noteBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + var(--safeB));z-index:40;display:none;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:rgba(255,253,246,.97);border-radius:16px;padding:8px 10px;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:calc(100vw - 16px)}
body.nt #noteBar{display:flex}
#noteBar .nc{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cbb;cursor:pointer}#noteBar .nc.on{box-shadow:0 0 0 3px #0da9a6}
#noteBar .hb{border:0;border-radius:10px;height:36px;padding:0 10px;font-weight:800;background:#efe6d2;color:#3a2a1a;font-size:13px;font-family:inherit}#noteBar .hb.on{background:#0d8f8c;color:#fff}
#noteBar .sep{width:1px;height:28px;background:#ddd}
body.nt #btnNote{background:#1a4fd0}
@media (max-width:700px){#noteBar{left:8px;right:8px;transform:none;max-width:none;gap:6px}}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ffe9c4;font-weight:800;font-size:18px;z-index:100;background:#2a1a0e;transition:opacity .5s}

/* ── هوية الثالث المتوسط: ناضجة بألوان الوزارة ── */
.tb.on{background:#0da9a6}
#credit{position:fixed;bottom:calc(74px + var(--safeB));left:12px;z-index:4;background:rgba(7,28,38,.72);color:#e6f2f5;font-weight:800;font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.12);pointer-events:none}
@media (max-width:700px){#credit{display:none}}

<div id="instM" style="position:fixed;inset:0;z-index:2147483647;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;direction:rtl">
<div style="background:#f6f9fa;color:#2a1d11;border-radius:18px;max-width:420px;width:100%;padding:18px 18px 14px;font-family:Tajawal,sans-serif;box-shadow:0 10px 40px #0007">

<button id="instX" style="margin-top:12px;width:100%;border:0;border-radius:12px;padding:11px;background:#15445a;color:#fff;font:700 16px Tajawal,sans-serif">حسنًا</button></div></div>
<script>
(function(){
  var dp=null, ua=navigator.userAgent, isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
      isAnd=/Android/i.test(ua), isApk=location.hostname==='book.sci9.local',
      standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true,
      local=location.protocol==='file:'||!!window.__IMG, framed=false;
  try{framed=window.top!==window.self}catch(e){framed=true}
  function hide(){['btnInstall'].forEach(function(id){var b=document.getElementById(id);if(b)b.style.display='none'});var t=document.querySelector('#toolsPop [data-t="btnInstall"]');if(t)t.style.display='none'}
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e});
  addEventListener('appinstalled',function(){hide()});
  function msg(h){document.getElementById('instB').innerHTML=h;document.getElementById('instM').style.display='flex'}
  function go(){
    if(dp){dp.prompt();dp.userChoice.then(function(){dp=null});return}
    if(local){msg('هذه النسخةُ <b>ملفٌّ محفوظٌ على جهازك</b>، وهي تعملُ دونَ إنترنت بفتحِها مباشرةً في أيِّ وقت، فلا تحتاجُ إلى تثبيت.<br>أمّا إضافتُها أيقونةً كتطبيق فلا تسمحُ بها المتصفّحاتُ لأيِّ ملفٍّ محلّي.<br><br>• <b>أندرويد:</b> ثبّتْ ملفَّ التطبيقِ <b>APK</b>.<br>• <b>آيفون وآيباد والحاسوب:</b> افتحِ الكتابَ من <b>رابطِ موقعِه</b> على الإنترنت، ثم اضغطْ زرَّ «تثبيت» هناك.');return}
    if(framed){msg('الكتابُ معروضٌ داخلَ صفحةٍ أخرى، والتثبيتُ يحتاجُ إلى فتحِه في نافذةٍ مستقلّة.<br><br><a href="'+location.href.split('#')[0]+'" target="_blank" rel="noopener" style="display:inline-block;background:#0da9a6;color:#fff;padding:8px 14px;border-radius:10px;text-decoration:none;font-weight:700">↗ افتحِ الكتابَ في نافذةٍ مستقلّة</a><br>ثم اضغطْ «تثبيت» مرّةً أخرى.');return}
    if(isIOS){ if(/CriOS|FxiOS|EdgiOS/.test(ua)){msg('على الآيفون والآيباد يتمُّ التثبيتُ من متصفّحِ <b>Safari</b>: انسخِ الرابطَ وافتحْه في Safari، ثم اتّبعِ الخطوات.');return}
      msg('١. اضغطْ زرَّ <b>المشاركة</b> <span style="font-size:20px">⬆️</span> أسفلَ الشاشة (أو أعلاها في الآيباد).<br>٢. اخترْ <b>«إضافة إلى الشاشة الرئيسية»</b>.<br>٣. اضغطْ <b>«إضافة»</b>.<br><br>بعدَ ظهورِ رسالةِ «✓ اكتملَ التجهيز» يعملُ الكتابُ من أيقونتِه دونَ إنترنت.');return}
    if(isAnd){msg('١. اضغطْ قائمةَ المتصفّح <b>⋮</b> أعلى الشاشة.<br>٢. اخترْ <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.<br><br>أو ثبّتْ ملفَّ التطبيقِ <b>APK</b> مباشرة.');return}
    msg('في <b>Chrome</b> أو <b>Edge</b>: اضغطْ أيقونةَ التثبيت <span style="font-size:18px">⊕</span> في يسارِ شريطِ العنوان، أو من القائمة <b>⋮</b> اخترْ «حفظ ومشاركة» ← <b>«تثبيت الصفحة كتطبيق»</b>.<br><br>في <b>Safari</b> على ماك: قائمة «ملف» ← <b>«إضافة إلى Dock»</b>.');
  }
  function init(){
    if(standalone||isApk){hide();return}
    document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('#btnInstall,#toolsPop [data-t="btnInstall"]');if(!t)return;e.preventDefault();e.stopPropagation();var tp=document.getElementById('toolsPop');if(tp)tp.classList.remove('open');go()},true);
    document.getElementById('instX').onclick=document.getElementById('instM').onclick=function(e){if(e.target.id==='instX'||e.target.id==='instM')document.getElementById('instM').style.display='none'};
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
